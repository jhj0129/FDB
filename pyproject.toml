[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-decision-brain"
version = "0.2.0"
description = "A connectome-inspired decision system, starting with a deterministic 2D decision loop."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FDB contributors"}]
dependencies = []

[project.optional-dependencies]
physics = ["mujoco>=3.13,<4"]
robot = ["mujoco>=3.13,<4", "mujoco-menagerie==2026.9.0"]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
fdb = "fdb.cli:main"
fdb-v1 = "fdb.v1.cli:main"
fdb-v1-robustness = "fdb.v1.robustness_cli:main"
fdb-v2 = "fdb.v2.cli:main"
fdb-v2-reach-suite = "fdb.v2.reach_suite_cli:main"
fdb-v2-pose = "fdb.v2.pose_reach_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fdb.v1" = ["assets/*.xml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
