[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-decision-brain"
version = "0.2.0"
description = "A connectome-inspired decision system, starting with a deterministic 2D decision loop."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FDB contributors"}]
dependencies = []

[project.optional-dependencies]
physics = ["mujoco>=3.13,<4"]
robot = ["mujoco>=3.13,<4", "mujoco-menagerie==2026.9.0", "imageio-ffmpeg>=0.6,<1"]
neural = ["mujoco>=3.13,<4", "numpy>=2,<3", "torch>=2.5,<3", "imageio-ffmpeg>=0.6,<1"]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
fdb = "fdb.cli:main"
fdb-v1 = "fdb.v1.cli:main"
fdb-v1-robustness = "fdb.v1.robustness_cli:main"
fdb-v2 = "fdb.v2.cli:main"
fdb-v2-reach-suite = "fdb.v2.reach_suite_cli:main"
fdb-v2-pose = "fdb.v2.pose_reach_cli:main"
fdb-v2-pregrasp = "fdb.v2.pregrasp_cli:main"
fdb-v2-grasp-lift = "fdb.v2.grasp_lift_cli:main"
fdb-v2-pick-place = "fdb.v2.pick_place_cli:main"
fdb-v2-manipulation-suite = "fdb.v2.manipulation_suite_cli:main"
fdb-v2-recovery = "fdb.v2.recovery_cli:main"
fdb-v3-inspect = "fdb.v3.cli:main"
fdb-v4-probe = "fdb.v4.cli:main"
fdb-render-final = "fdb.v2.render_final:main"
fdb-v5-data = "fdb.v5.data_cli:main"
fdb-v5-train = "fdb.v5.train_cli:main"
fdb-v5-hybrid = "fdb.v5.hybrid_cli:main"
fdb-v5-render = "fdb.v5.render_neural:main"
fdb-v5-safety-envelope = "fdb.v5.safety_envelope:main"
fdb-v5-report = "fdb.v5.report_cli:main"
fdb-v5-safety-data = "fdb.v5.safety_data:main"
fdb-v5-safety-train = "fdb.v5.safety_training:main"
fdb-humanoid-challenge = "fdb.challenge.humanoid_suite:main"
fdb-render-humanoids = "fdb.challenge.render_humanoids:main"
fdb-humanoid-balance-data = "fdb.challenge.balance_data:main"
fdb-humanoid-balance-train = "fdb.challenge.balance_training:main"
fdb-multi-object-sort = "fdb.challenge.multi_object_sorting:main"
fdb-human-gait = "fdb.challenge.human_gait:main"
fdb-object-sort-train = "fdb.challenge.object_sort_training:main"
fdb-gait-robustness = "fdb.challenge.gait_robustness:main"
fdb-sorting-robustness = "fdb.challenge.sorting_robustness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fdb.v1" = ["assets/*.xml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
